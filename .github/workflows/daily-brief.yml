name: Brief Update (3-day cycle)

on:
  schedule:
    # GitHub Actions cron is best-effort; 06:00/07:30 UTC slots get dropped
    # frequently. Stack multiple slots — skip-guard exits <10s on the fast
    # path so the extra firings are zero-cost. Pattern observed: first
    # reliable firing is usually 08:30 UTC+ on this runner.
    - cron: '0 6 */3 * *'    # 06:00 UTC primary (often drops)
    - cron: '30 7 */3 * *'   # 07:30 UTC backup (often drops)
    - cron: '15 8 */3 * *'   # 08:15 UTC — usually fires
    - cron: '0 10 */3 * *'   # 10:00 UTC mid-morning
    - cron: '0 13 */3 * *'   # 13:00 UTC afternoon catch
    - cron: '0 17 */3 * *'   # 17:00 UTC end-of-day fallback
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brief-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 30 }

      - name: Skip if today already updated (same-day dedup across cron slots)
        id: skip
        shell: bash
        run: |
          # Manual dispatch always bypasses.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch — bypassing skip-guard."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Cadence is enforced by the cron schedule (*/3 days). This guard
          # only dedups the 6 same-day cron slots, so the FIRST one fires
          # and the rest no-op. Compare last commit's UTC date with today.
          LAST_COMMIT_DATE=$(git log --grep="Brief update" -1 --pretty=format:"%cs" 2>/dev/null || echo "")
          TODAY=$(date -u +%Y-%m-%d)
          echo "Last 'Brief update' commit date: $LAST_COMMIT_DATE · today: $TODAY"
          if [[ "$LAST_COMMIT_DATE" == "$TODAY" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already updated today — skipping later cron slot."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - if: steps.skip.outputs.skip != 'true'
        run: pip install -r .github/scripts/requirements.txt

      - if: steps.skip.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .github/scripts/update_brief.py

      - if: steps.skip.outputs.skip != 'true'
        run: |
          git config user.name "Brief Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --quiet --cached; then
            echo "No changes."
          else
            git commit -m "Brief update: $(date -u +%Y-%m-%d)"
            git push
          fi
