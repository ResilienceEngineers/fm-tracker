name: Brief Update (3-day cycle)

on:
  schedule:
    # Day-81 (19 May 2026) burned all 6 fixed slots: GitHub Actions cron
    # silently dropped the entire day. Switching to hourly attempts —
    # skip-guard exits <10s on the fast path, so 24 attempts/day is the
    # same compute cost as 6 but with 4× the chance of catching when
    # GitHub's cron-scheduler is degraded. Workflow itself decides which
    # day actually triggers a real run via the */3 calendar check below.
    #
    # If even hourly stops being reliable, the durable fix is external —
    # Cloudflare Workers cron (~50 lines, free tier, sub-second firing
    # per the other-site lessons). For now, hourly is enough.
    - cron: '15 * * * *'   # every hour at :15 (avoiding contested :00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brief-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 30 }

      - name: Skip-guard — only run on */3 calendar day, only once per day
        id: skip
        shell: bash
        run: |
          # Manual dispatch always bypasses both checks.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch — bypassing skip-guard."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Same-day dedup — once a "Brief update" commit lands today,
          # every subsequent hourly attempt today no-ops.
          LAST_COMMIT_DATE=$(git log --grep="Brief update" -1 --pretty=format:"%cs" 2>/dev/null || echo "")
          TODAY=$(date -u +%Y-%m-%d)
          if [[ "$LAST_COMMIT_DATE" == "$TODAY" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already updated today ($TODAY) — skipping."
            exit 0
          fi

          # Days since the last successful brief. Day-198 audit: the API
          # credit balance ran out on 7 and 10 Sep 2026 — both cadence days
          # failed all 24 hourly attempts and were simply lost (9-day data
          # gap) because the gate only looked at the calendar. Catch-up
          # rule: a missed cadence day is retried every hour on the
          # following days until a brief lands.
          DAYS_SINCE=999
          if [[ -n "$LAST_COMMIT_DATE" ]]; then
            DAYS_SINCE=$(( ( $(date -u -d "$TODAY" +%s) - $(date -u -d "$LAST_COMMIT_DATE" +%s) ) / 86400 ))
          fi

          # Cadence gate — proceed on a */3 calendar day of month (1, 4, 7,
          # 10, 13, 16, 19, 22, 25, 28, 31) OR whenever the last brief is
          # ≥ 4 days old (a cadence day was missed → catch up now).
          DAY_OF_MONTH=$(date -u +%d)
          DAY_INT=$((10#$DAY_OF_MONTH))
          CADENCE_DAY=$(( (DAY_INT - 1) % 3 == 0 ? 1 : 0 ))
          if [[ $CADENCE_DAY -eq 1 ]]; then
            echo "Proceeding: $TODAY is a */3 cadence day and no update yet today (last brief $LAST_COMMIT_DATE, $DAYS_SINCE d ago)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ $DAYS_SINCE -ge 4 ]]; then
            echo "Proceeding (CATCH-UP): last brief $LAST_COMMIT_DATE is $DAYS_SINCE days old — a cadence day was missed."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "Today ($TODAY, day-of-month $DAY_INT) is not a cadence day and last brief ($LAST_COMMIT_DATE) is only $DAYS_SINCE d old — skipping."

      - if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - if: steps.skip.outputs.skip != 'true'
        run: pip install -r .github/scripts/requirements.txt

      - if: steps.skip.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .github/scripts/update_brief.py

      - if: steps.skip.outputs.skip != 'true'
        run: |
          git config user.name "Brief Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --quiet --cached; then
            echo "No changes."
          else
            git commit -m "Brief update: $(date -u +%Y-%m-%d)"
            git push
          fi
